name: CI

on:
    workflow_dispatch:
    pull_request:
    push:

permissions:
    contents: read

env:
    # Aqua's GHSA-69fq-xp46-6x23 advisory identifies v0.69.3 as a
    # known-safe immutable binary after the March 2026 supply-chain incident.
    TRIVY_VERSION: v0.69.3

jobs:
    # Dependency, secret, and license regressions must fail the pull request
    # that introduces them. The release workflow repeats these scans against
    # the tagged tree and the built images before anything is published.
    scan-source:
        name: Source secret, vulnerability, and license scan
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
            - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
              with:
                  cache: true
                  version: ${{ env.TRIVY_VERSION }}
            - name: Assert trusted Trivy version
              run: |
                  test "$(trivy --version | head -n 1)" = 'Version: 0.69.3'
            - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
              with:
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln,secret,license
                  severity: HIGH,CRITICAL
                  exit-code: '1'
                  skip-setup-trivy: true

    verify:
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
              with:
                  version: 11.9.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 24
                  cache: pnpm
            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_version: 1.15.7
                  terraform_wrapper: false
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            # Adds the source-boundary audit (live edit adapters, Wikimedia
            # token storage, unsafe HTML insertion, embedded keys, sensitive
            # request logging) that `pnpm check` does not run.
            - run: pnpm test:security
            - run: pnpm build
            - name: Validate Terraform module
              run: |
                  terraform -chdir=infra/terraform fmt -check -recursive
                  terraform -chdir=infra/terraform init -backend=false -input=false
                  terraform -chdir=infra/terraform validate
            - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
              with:
                  cache: true
                  version: ${{ env.TRIVY_VERSION }}
            - name: Assert trusted Trivy version
              run: |
                  test "$(trivy --version | head -n 1)" = 'Version: 0.69.3'
            - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
              with:
                  scan-type: config
                  scan-ref: infra/terraform
                  severity: HIGH,CRITICAL
                  exit-code: '1'
                  skip-setup-trivy: true
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm test:e2e
            - run: docker build --target api --tag wikione-api:ci .
            - run: docker build --target preview --tag wikione-preview:ci .
            - run: docker build --target web --tag wikione-web:ci .
            # Non-root users, HEALTHCHECKs, SPDX labels, and a read-only
            # runtime are release requirements, so they gate every push.
            - name: Verify container hardening
              env:
                  API_IMAGE: wikione-api:ci
                  PREVIEW_IMAGE: wikione-preview:ci
                  WEB_IMAGE: wikione-web:ci
              run: pnpm container:smoke
            - run: docker compose config --quiet
