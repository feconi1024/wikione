name: CI

on:
    workflow_dispatch:
    pull_request:
    push:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 11.9.0
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm build
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm test:e2e
            - run: docker build --target api --tag wikione-api:ci .
            - run: docker build --target preview --tag wikione-preview:ci .
            - run: docker build --target web --tag wikione-web:ci .
            - run: docker compose config --quiet
