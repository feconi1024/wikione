name: CI

on:
    workflow_dispatch:
    pull_request:
    push:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
              with:
                  version: 11.9.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 24
                  cache: pnpm
            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_version: 1.15.7
                  terraform_wrapper: false
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm build
            - name: Validate Terraform module
              run: |
                  terraform -chdir=infra/terraform fmt -check -recursive
                  terraform -chdir=infra/terraform init -backend=false -input=false
                  terraform -chdir=infra/terraform validate
            - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
              with:
                  scan-type: config
                  scan-ref: infra/terraform
                  severity: HIGH,CRITICAL
                  exit-code: '1'
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm test:e2e
            - run: docker build --target api --tag wikione-api:ci .
            - run: docker build --target preview --tag wikione-preview:ci .
            - run: docker build --target web --tag wikione-web:ci .
            - run: docker compose config --quiet
