name: Deploy signed release

on:
    workflow_dispatch:
        inputs:
            environment:
                description: Protected GitHub environment and Terraform environment name
                required: true
                type: environment
            action:
                description: Reviewed deployment operation
                required: true
                type: choice
                options:
                    - plan
                    - canary
                    - promote
                    - rollback
            release_run_id:
                description: OCI release workflow run ID for plan, canary, or promotion
                required: false
                type: string
            rollback_revision:
                description: Previously deployed 40-character revision for rollback
                required: false
                type: string

permissions:
    actions: read
    contents: read
    id-token: write

concurrency:
    group: wikione-deploy-${{ inputs.environment }}
    cancel-in-progress: false

jobs:
    deploy:
        name: ${{ inputs.action }} ${{ inputs.environment }}
        runs-on: ubuntu-24.04
        timeout-minutes: 75
        environment:
            name: ${{ inputs.environment }}
        env:
            AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
            AWS_REGION: ${{ vars.AWS_REGION }}
            CANARY_CONFIG_BUCKET: ${{ vars.CANARY_CONFIG_BUCKET }}
            DEPLOYMENT_ACTION: ${{ inputs.action }}
            DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
            TF_IN_AUTOMATION: 'true'
            TF_INPUT: 'false'
            TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
            TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
            TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
            TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
            TF_VAR_api_secret_arns: ${{ secrets.API_SECRET_ARNS_JSON }}
            TF_VAR_availability_zones: ${{ vars.AVAILABILITY_ZONES_JSON }}
            TF_VAR_aws_region: ${{ vars.AWS_REGION }}
            TF_VAR_environment: ${{ inputs.environment }}
            TF_VAR_preview_secret_arns: '{}'
            TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
            TF_VAR_tags: ${{ vars.TERRAFORM_TAGS_JSON || '{}' }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0

            - name: Validate protected deployment inputs
              env:
                  RELEASE_RUN_ID: ${{ inputs.release_run_id }}
                  ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
              run: |
                  set -eu
                  for value in AWS_ACCOUNT_ID AWS_REGION TF_STATE_BUCKET TF_STATE_KEY TF_STATE_REGION TF_VAR_alert_email TF_VAR_availability_zones TF_VAR_route53_zone_name; do
                    test -n "${!value:-}" || { echo "Protected environment variable $value is required." >&2; exit 1; }
                  done
                  test -n "$TF_VAR_api_secret_arns" || { echo 'API_SECRET_ARNS_JSON is required.' >&2; exit 1; }
                  jq -e 'type == "array" and length >= 2' <<< "$TF_VAR_availability_zones" >/dev/null
                  jq -e 'type == "object"' <<< "$TF_VAR_api_secret_arns" >/dev/null
                  if [ "$DEPLOYMENT_ACTION" = rollback ]; then
                    [[ "$ROLLBACK_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'rollback_revision must be a full source revision.' >&2; exit 1; }
                  else
                    [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'release_run_id is required.' >&2; exit 1; }
                  fi
                  if [ "$DEPLOYMENT_ACTION" = canary ] && [ "$DEPLOYMENT_ENVIRONMENT" != staging ]; then
                    echo 'Canary releases must use the protected staging environment.' >&2
                    exit 1
                  fi
                  if [ "$DEPLOYMENT_ACTION" = promote ] && [ "$DEPLOYMENT_ENVIRONMENT" != production ]; then
                    echo 'Promotion must use the protected production environment.' >&2
                    exit 1
                  fi
                  if [ "$DEPLOYMENT_ACTION" = promote ] && [ -z "$CANARY_CONFIG_BUCKET" ]; then
                    echo 'Production promotion requires CANARY_CONFIG_BUCKET.' >&2
                    exit 1
                  fi

            - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  role-session-name: wikione-${{ github.run_id }}
                  aws-region: ${{ vars.AWS_REGION }}
                  allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

            - uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: inputs.action != 'rollback'
              with:
                  name: wikione-release-manifest
                  path: release-artifacts
                  github-token: ${{ github.token }}
                  run-id: ${{ inputs.release_run_id }}

            - name: Retrieve signed rollback manifest
              if: inputs.action == 'rollback'
              env:
                  ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
              run: |
                  set -eu
                  bucket="wikione-$DEPLOYMENT_ENVIRONMENT-$AWS_ACCOUNT_ID-config"
                  mkdir -p release-artifacts
                  aws s3 cp "s3://$bucket/releases/$ROLLBACK_REVISION/release-manifest.json" release-artifacts/release-manifest.json --no-progress
                  aws s3 cp "s3://$bucket/releases/$ROLLBACK_REVISION/release-manifest.sigstore.json" release-artifacts/release-manifest.sigstore.json --no-progress

            - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

            - name: Verify manifest, images, and anonymous registry access
              env:
                  CERTIFICATE_IDENTITY_REGEXP: ^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/(heads|tags)/.+$
              run: |
                  set -eu
                  manifest=release-artifacts/release-manifest.json
                  bundle=release-artifacts/release-manifest.sigstore.json
                  cosign verify-blob \
                    --bundle "$bundle" \
                    --certificate-identity-regexp "$CERTIFICATE_IDENTITY_REGEXP" \
                    --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                    "$manifest"
                  jq -e '
                    (keys == ["images", "publishedAt", "revision", "version"]) and
                    (.revision | test("^[0-9a-f]{40}$")) and
                    (.publishedAt | fromdateiso8601 > 0) and
                    (.images | keys == ["api", "preview", "web"]) and
                    ([.images[] | test("^ghcr\\.io/.+@sha256:[0-9a-f]{64}$")] | all)
                  ' "$manifest" >/dev/null
                  docker logout ghcr.io >/dev/null 2>&1 || true
                  for service in api preview web; do
                    image="$(jq -r --arg service "$service" '.images[$service]' "$manifest")"
                    docker buildx imagetools inspect "$image" >/dev/null
                    cosign verify \
                      --certificate-identity-regexp "$CERTIFICATE_IDENTITY_REGEXP" \
                      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                      "$image" >/dev/null
                  done
                  revision="$(jq -r .revision "$manifest")"
                  echo "RELEASE_REVISION=$revision" >> "$GITHUB_ENV"
                  echo "TF_VAR_container_image_digests=$(jq -c .images "$manifest")" >> "$GITHUB_ENV"
                  git checkout --detach "$revision"

            - name: Require the exact staging canary manifest for promotion
              if: inputs.action == 'promote'
              env:
                  CERTIFICATE_IDENTITY_REGEXP: ^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/(heads|tags)/.+$
              run: |
                  set -eu
                  mkdir -p canary-release
                  prefix="s3://$CANARY_CONFIG_BUCKET/environments/staging/current"
                  aws s3 cp "$prefix/release-manifest.json" canary-release/release-manifest.json --no-progress
                  aws s3 cp "$prefix/release-manifest.sigstore.json" canary-release/release-manifest.sigstore.json --no-progress
                  cosign verify-blob \
                    --bundle canary-release/release-manifest.sigstore.json \
                    --certificate-identity-regexp "$CERTIFICATE_IDENTITY_REGEXP" \
                    --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                    canary-release/release-manifest.json
                  cmp --silent release-artifacts/release-manifest.json canary-release/release-manifest.json || {
                    echo 'Production manifest does not exactly match the last successful staging canary.' >&2
                    exit 1
                  }

            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_version: 1.15.7
                  terraform_wrapper: false

            - name: Initialize, validate, and plan exact digests
              run: |
                  set -eu
                  terraform -chdir=infra/terraform init -input=false \
                    -backend-config="bucket=$TF_STATE_BUCKET" \
                    -backend-config="key=$TF_STATE_KEY" \
                    -backend-config="region=$TF_STATE_REGION" \
                    -backend-config="use_lockfile=true"
                  terraform -chdir=infra/terraform fmt -check -recursive
                  terraform -chdir=infra/terraform validate
                  terraform -chdir=infra/terraform plan -input=false -out=deployment.tfplan
                  sha256sum infra/terraform/deployment.tfplan > release-artifacts/terraform-plan.sha256

            - name: Preserve current last-known-good manifest
              if: inputs.action != 'plan'
              env:
                  CERTIFICATE_IDENTITY_REGEXP: ^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/(heads|tags)/.+$
              run: |
                  set -eu
                  bucket="wikione-$DEPLOYMENT_ENVIRONMENT-$AWS_ACCOUNT_ID-config"
                  mkdir -p previous-release
                  if aws s3 cp "s3://$bucket/environments/$DEPLOYMENT_ENVIRONMENT/current/release-manifest.json" previous-release/release-manifest.json --no-progress \
                    && aws s3 cp "s3://$bucket/environments/$DEPLOYMENT_ENVIRONMENT/current/release-manifest.sigstore.json" previous-release/release-manifest.sigstore.json --no-progress; then
                    cosign verify-blob \
                      --bundle previous-release/release-manifest.sigstore.json \
                      --certificate-identity-regexp "$CERTIFICATE_IDENTITY_REGEXP" \
                      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                      previous-release/release-manifest.json
                    jq -e '(.images | keys == ["api", "preview", "web"]) and ([.images[] | test("^ghcr\\.io/.+@sha256:[0-9a-f]{64}$")] | all)' previous-release/release-manifest.json >/dev/null
                  else
                    rm -f previous-release/release-manifest.json previous-release/release-manifest.sigstore.json
                  fi

            - name: Apply, smoke-test, and automatically restore on failure
              if: inputs.action != 'plan'
              run: |
                  set -eu
                  rollback_previous() {
                    if [ ! -f previous-release/release-manifest.json ]; then
                      echo 'No prior last-known-good manifest exists; ECS circuit breakers remain the automatic task-level rollback.' >&2
                      return 1
                    fi
                    rollback_images="$(jq -c .images previous-release/release-manifest.json)"
                    export TF_VAR_container_image_digests="$rollback_images"
                    terraform -chdir=infra/terraform plan -input=false -out=automatic-rollback.tfplan
                    terraform -chdir=infra/terraform apply -input=false -auto-approve automatic-rollback.tfplan
                  }
                  smoke() {
                    app_url="$(terraform -chdir=infra/terraform output -raw app_url)"
                    api_url="$(terraform -chdir=infra/terraform output -raw api_url)"
                    preview_url="$(terraform -chdir=infra/terraform output -raw preview_url)"
                    app_headers="$(mktemp)"
                    api_headers="$(mktemp)"
                    preview_headers="$(mktemp)"
                    curl --fail --silent --show-error --retry 10 --retry-delay 6 --proto '=https' --tlsv1.2 -D "$app_headers" "$app_url/healthz" >/dev/null
                    curl --fail --silent --show-error --retry 10 --retry-delay 6 --proto '=https' --tlsv1.2 -H "Origin: $app_url" -D "$api_headers" "$api_url/readyz" >/dev/null
                    curl --fail --silent --show-error --retry 10 --retry-delay 6 --proto '=https' --tlsv1.2 -D "$preview_headers" "$preview_url/readyz" >/dev/null
                    curl --fail --silent --show-error --proto '=https' --tlsv1.2 "$api_url/openapi.json" >/dev/null
                    grep -Eqi "^content-security-policy:.*connect-src $api_url([ ;]|$).*frame-src $preview_url([ ;]|$)" "$app_headers"
                    grep -Fqi "access-control-allow-origin: $app_url" "$api_headers"
                    if grep -Eqi '^set-cookie:' "$preview_headers"; then
                      echo 'The isolated preview origin emitted a cookie.' >&2
                      return 1
                    fi
                  }
                  if ! terraform -chdir=infra/terraform apply -input=false -auto-approve deployment.tfplan; then
                    rollback_previous || true
                    exit 1
                  fi
                  if ! smoke; then
                    rollback_previous || true
                    exit 1
                  fi

            - name: Persist config-only release and last-known-good records
              if: inputs.action != 'plan'
              env:
                  RELEASE_RUN_ID: ${{ inputs.release_run_id }}
              run: |
                  set -eu
                  bucket="$(terraform -chdir=infra/terraform output -raw config_backup_bucket)"
                  plan_sha256="$(cut -d ' ' -f 1 release-artifacts/terraform-plan.sha256)"
                  jq -n \
                    --arg action "$DEPLOYMENT_ACTION" \
                    --arg environment "$DEPLOYMENT_ENVIRONMENT" \
                    --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    --arg deploymentWorkflowRunId "$GITHUB_RUN_ID" \
                    --arg releaseWorkflowRunId "$RELEASE_RUN_ID" \
                    --arg revision "$RELEASE_REVISION" \
                    --arg terraformPlanSha256 "$plan_sha256" \
                    '{action: $action, environment: $environment, deployedAt: $deployedAt, deploymentWorkflowRunId: $deploymentWorkflowRunId, releaseWorkflowRunId: $releaseWorkflowRunId, revision: $revision, terraformPlanSha256: $terraformPlanSha256}' \
                    > release-artifacts/deployment-record.json
                  release_prefix="s3://$bucket/releases/$RELEASE_REVISION"
                  current_prefix="s3://$bucket/environments/$DEPLOYMENT_ENVIRONMENT/current"
                  aws s3 cp release-artifacts/release-manifest.json "$release_prefix/release-manifest.json" --no-progress
                  aws s3 cp release-artifacts/release-manifest.sigstore.json "$release_prefix/release-manifest.sigstore.json" --no-progress
                  aws s3 cp infra/terraform/deployment.tfplan "$release_prefix/terraform-plan.bin" --no-progress
                  aws s3 cp release-artifacts/terraform-plan.sha256 "$release_prefix/terraform-plan.sha256" --no-progress
                  aws s3 cp release-artifacts/deployment-record.json "$release_prefix/deployment-$GITHUB_RUN_ID.json" --no-progress
                  aws s3 cp release-artifacts/release-manifest.json "$current_prefix/release-manifest.json" --no-progress
                  aws s3 cp release-artifacts/release-manifest.sigstore.json "$current_prefix/release-manifest.sigstore.json" --no-progress
                  aws s3 cp release-artifacts/deployment-record.json "$current_prefix/deployment-record.json" --no-progress
