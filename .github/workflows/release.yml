name: OCI release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: Immutable release version recorded in the manifest
                required: true
                default: 0.0.0-dev

permissions:
    contents: read
    packages: write
    id-token: write
    attestations: write
    security-events: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAMESPACE: ${{ github.repository_owner }}/wikione
    VERSION: ${{ inputs.version || github.ref_name }}

jobs:
    scan-source:
        name: Source secret, vulnerability, and license scan
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0
            - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
              with:
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln,secret,license
                  format: sarif
                  output: trivy-source.sarif
                  severity: HIGH,CRITICAL
                  exit-code: '1'
            - uses: github/codeql-action/upload-sarif@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66 # v3
              if: always() && hashFiles('trivy-source.sarif') != ''
              with:
                  sarif_file: trivy-source.sarif

    publish:
        needs: scan-source
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        outputs:
            api_digest: ${{ steps.digests.outputs.api_digest }}
            preview_digest: ${{ steps.digests.outputs.preview_digest }}
            web_digest: ${{ steps.digests.outputs.web_digest }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
            - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and publish immutable multi-platform images
              env:
                  VCS_REF: ${{ github.sha }}
              run: >-
                  docker buildx bake default --push
                  --set '*.attest=type=provenance,mode=max'
                  --set '*.attest=type=sbom'
                  --set 'api.tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-api:${{ github.sha }}'
                  --set 'preview.tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-preview:${{ github.sha }}'
                  --set 'web.tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-web:${{ github.sha }}'
            - id: digests
              name: Resolve immutable image digests
              run: |
                  api="$(docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAMESPACE-api:$GITHUB_SHA" --format '{{.Digest}}')"
                  preview="$(docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAMESPACE-preview:$GITHUB_SHA" --format '{{.Digest}}')"
                  web="$(docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAMESPACE-web:$GITHUB_SHA" --format '{{.Digest}}')"
                  printf 'api_digest=%s\npreview_digest=%s\nweb_digest=%s\n' "$api" "$preview" "$web" >> "$GITHUB_OUTPUT"
            - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
              with:
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-api@${{ steps.digests.outputs.api_digest }}
                  format: spdx-json
                  artifact-name: wikione-api.spdx.json
            - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
              with:
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-preview@${{ steps.digests.outputs.preview_digest }}
                  format: spdx-json
                  artifact-name: wikione-preview.spdx.json
            - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
              with:
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-web@${{ steps.digests.outputs.web_digest }}
                  format: spdx-json
                  artifact-name: wikione-web.spdx.json
            - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
              with:
                  image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-api@${{ steps.digests.outputs.api_digest }}
                  format: sarif
                  output: trivy-api.sarif
                  severity: HIGH,CRITICAL
                  exit-code: '1'
            - uses: github/codeql-action/upload-sarif@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66 # v3
              if: always() && hashFiles('trivy-api.sarif') != ''
              with:
                  sarif_file: trivy-api.sarif
            - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
              with:
                  image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-preview@${{ steps.digests.outputs.preview_digest }}
                  format: sarif
                  output: trivy-preview.sarif
                  severity: HIGH,CRITICAL
                  exit-code: '1'
            - uses: github/codeql-action/upload-sarif@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66 # v3
              if: always() && hashFiles('trivy-preview.sarif') != ''
              with:
                  sarif_file: trivy-preview.sarif
            - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
              with:
                  image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-web@${{ steps.digests.outputs.web_digest }}
                  format: sarif
                  output: trivy-web.sarif
                  severity: HIGH,CRITICAL
                  exit-code: '1'
            - uses: github/codeql-action/upload-sarif@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66 # v3
              if: always() && hashFiles('trivy-web.sarif') != ''
              with:
                  sarif_file: trivy-web.sarif
            - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
            - name: Keylessly sign immutable digests
              run: |
                  cosign sign --yes "$REGISTRY/$IMAGE_NAMESPACE-api@${{ steps.digests.outputs.api_digest }}"
                  cosign sign --yes "$REGISTRY/$IMAGE_NAMESPACE-preview@${{ steps.digests.outputs.preview_digest }}"
                  cosign sign --yes "$REGISTRY/$IMAGE_NAMESPACE-web@${{ steps.digests.outputs.web_digest }}"

    manifest:
        needs: publish
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: Create release deployment manifest
              run: |
                  mkdir -p release-artifacts
                  jq -n \
                    --arg version "$VERSION" \
                    --arg revision "$GITHUB_SHA" \
                    --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    --arg api "$REGISTRY/$IMAGE_NAMESPACE-api@${{ needs.publish.outputs.api_digest }}" \
                    --arg preview "$REGISTRY/$IMAGE_NAMESPACE-preview@${{ needs.publish.outputs.preview_digest }}" \
                    --arg web "$REGISTRY/$IMAGE_NAMESPACE-web@${{ needs.publish.outputs.web_digest }}" \
                    '{version: $version, revision: $revision, publishedAt: $publishedAt, images: {api: $api, preview: $preview, web: $web}}' \
                    > release-artifacts/release-manifest.json
            - name: Validate release deployment manifest
              run: |
                  jq -e --arg revision "$GITHUB_SHA" '
                    .revision == $revision and
                    (.publishedAt | fromdateiso8601 > 0) and
                    (.images | keys == ["api", "preview", "web"]) and
                    ([.images[] | test("^ghcr\\.io/.+@sha256:[0-9a-f]{64}$")] | all)
                  ' release-artifacts/release-manifest.json
            - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
            - name: Keylessly sign release deployment manifest
              run: >-
                  cosign sign-blob --yes
                  --bundle release-artifacts/release-manifest.sigstore.json
                  release-artifacts/release-manifest.json
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: wikione-release-manifest
                  path: release-artifacts/
                  if-no-files-found: error
