services:
    api:
        build:
            context: .
        environment:
            API_HOST: 0.0.0.0
            API_PORT: 3000
        ports:
            - '3000:3000'
        depends_on:
            redis:
                condition: service_healthy

    redis:
        image: redis:7.4-alpine
        command: ['redis-server', '--appendonly', 'yes']
        ports:
            - '6379:6379'
        volumes:
            - wikione-redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    wikione-redis:
