services:
    web:
        build:
            context: .
            target: web
        ports:
            - '127.0.0.1:5173:8080'
        environment:
            ALLOW_INSECURE_LOOPBACK_ORIGINS: 'true'
            API_ORIGIN: http://127.0.0.1:3000
            PREVIEW_ORIGIN: http://127.0.0.1:4174
        depends_on:
            api:
                condition: service_healthy
            preview:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/livez']
            interval: 5s
            timeout: 3s
            retries: 10
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        read_only: true
        tmpfs:
            - /tmp
            # Nginx writes the env-substituted CSP template here at startup.
            - /etc/nginx/conf.d:uid=101,gid=101,mode=0755

    api:
        build:
            context: .
            target: api
        environment:
            API_HOST: 0.0.0.0
            API_PORT: 3000
            COOKIE_SECURE: 'false'
            DATABASE_URL: postgres://wikione:wikione@postgres:5432/wikione
            EDITOR_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
            MEDIAWIKI_USER_AGENT: WikiOne/0.1 (https://github.com/feconi1024/wikione; local-development)
            NODE_ENV: development
            PREVIEW_BASE_URL: http://127.0.0.1:4174
            PREVIEW_TTL_MILLISECONDS: 120000
            REDIS_URL: redis://redis:6379
            SESSION_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
            SESSION_KEY_ID: compose-development
            SESSION_LOOKUP_HMAC_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
        ports:
            - '127.0.0.1:3000:3000'
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3000/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 10
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL

    preview:
        build:
            context: .
            target: preview
        environment:
            EDITOR_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
            NODE_ENV: development
            PREVIEW_HOST: 0.0.0.0
            PREVIEW_PORT: 4174
            REDIS_URL: redis://redis:6379
        ports:
            - '127.0.0.1:4174:4174'
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:4174/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 10
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL

    redis:
        # Local development only. Production uses managed Redis through IaC.
        image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        command: ['redis-server', '--save', '', '--appendonly', 'no']
        ports:
            - '127.0.0.1:6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10
        read_only: true
        tmpfs:
            - /data
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            # The official entrypoint fixes tmpfs ownership, then drops to redis.
            - CHOWN
            - SETGID
            - SETUID

    postgres:
        # Local development only. Production uses managed PostgreSQL through IaC.
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        environment:
            POSTGRES_DB: wikione
            POSTGRES_PASSWORD: wikione
            POSTGRES_USER: wikione
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - account-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U wikione -d wikione']
            interval: 5s
            timeout: 3s
            retries: 10
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            # The official entrypoint initializes the named volume, then drops
            # to postgres. These are not granted to the application services.
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID

volumes:
    account-data:
